name: Update Foosball Standings

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update standings
        run: python LeaugeInfo.py

      - name: Commit updated JSON files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Foosball-Website/national_foosball_standings.json
          git add Foosball-Website/national_foosball_standings_jv.json

          if git diff --cached --quiet; then
            echo "No standings changes."
          else
            git commit -m "Update foosball standings"

            for attempt in 1 2 3; do
              git fetch origin main

              if git rebase origin/main; then
                :
              else
                git rebase --abort
                echo "Rebase conflict; standings update was not pushed."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Standings pushed successfully."
                break
              fi

              echo "Push rejected on attempt $attempt; retrying with the latest main."
            done

            if ! git diff --quiet origin/main HEAD; then
              echo "Unable to push standings after 3 attempts."
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          test -f index.html
          test -f standings.html
          test -f standings.js
          test -f Foosball-Website/national_foosball_standings.json
          test -f Foosball-Website/national_foosball_standings_jv.json
          
      - name: Assemble Pages directory
        run: |
          rm -rf _site
          mkdir _site
          cp index.html standings.html standings.js style.css _site/
          cp -R Foosball-Website _site/
          cp epa_ff.png _site/
          test -f _site/Foosball-Website/national_foosball_standings.json
          test -f _site/Foosball-Website/national_foosball_standings_jv.json

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        uses: actions/deploy-pages@v4
